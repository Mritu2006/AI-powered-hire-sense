services:
  - type: web
    name: hiresense
    runtime: docker
    plan: free
    region: singapore
    branch: deployment/render-setup
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: HIRESENSE_DB_URL
        sync: false
      - key: HIRESENSE_DB_USERNAME
        sync: false
      - key: HIRESENSE_DB_PASSWORD
        sync: false
      - key: AFFINDA_API_KEY
        sync: false
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
